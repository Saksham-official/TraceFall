# The addresses the demo traces (OQ-15).
#
# Every one is designated by the US Office of Foreign Asset Control and appears in
# data/labels/ofac_sanctioned.json — publicly documented as fraud-linked by a named
# authority, with a date, which is the strongest provenance available without private
# law-enforcement data. None was chosen for a flattering result.
#
# They were selected by screening the 281 OFAC-designated TRON addresses in that dataset
# for USDT-TRC20 outflow inside the analysis window. **Only five of forty sampled had
# any** — the rest receive nothing but address-poisoning dust ("TG: jieuu", "ha138 com"),
# which is a fact about sanctioned addresses worth saying out loud rather than hiding
# behind a curated demo. See docs/research/OQ-15-demo-addresses.md.
#
# `scripts/demo_fixtures.py --check` walks every address here offline and fails if any
# hop the trace would take has no committed fixture. DEMO_SCRIPT.md walks the same list,
# so the rehearsal and the pre-flight check cannot drift apart. Fixtures are captured over
# `window_days` — the same slice the analysis asks for, so the two cannot disagree.

# The intake's own defaults. Nothing in the advanced panel is touched during the demo, so
# these are what the analysis actually runs with — and what the fixtures are captured for.
window_days: 90
max_depth: 5

addresses:
  - address: TUcjuVB6RFvsMgE352Kdc3VHvFvteti97B
    chain: TRON
    role: headline
    why: >
      Traces to 26 addresses over 30 edges in about seventy seconds, and reaches a second
      OFAC-designated address on the way. A real multi-hop flow to follow, not a single hop
      dressed up as one. It finishes PARTIAL with two branches DATA_UNAVAILABLE, and that
      is left alone on purpose: at depth five each fixture added widens the graph and
      exposes more frontier, because the trace runs into service addresses truncated at the
      10,000-transfer retrieval cap. A trace with no unfollowed branches would be the
      misleading one.

  - address: TWBAPzpPiZarfVsY2BLXeaLhNHurn4wkWG
    chain: TRON
    role: fan-out
    why: >
      Fifteen outbound transfers spread over nine destinations. All but one fall below the
      1% taint threshold, so the trace is two addresses wide and says so — the pruning rule
      doing its job on real data, which is worth showing.

  - address: TLFqEhiG7RUSZ9x5iph99Ke5782dkgRnWf
    chain: TRON
    role: funds-not-moved
    why: >
      Six outbound transfers into two destinations, and the trace ends `NO_OUTFLOW`: the
      money reached an address and stopped there. "The funds have not moved" and "we could
      not look" are different findings, and this is the first one.

  - address: TXoVNrqm11FFVKcF1vEND64gibVkr1HwAR
    chain: TRON
    role: honestly-unattributable
    why: >
      Three transfers in, one out — too little behaviour to classify, so the root is
      reported UNATTRIBUTED with reason INSUFFICIENT_ACTIVITY. The trace still follows the
      one transfer that left, five addresses into a cluster of high-volume services. A
      quiet address is not a dead end, and an unidentified one is not a failure: recall on
      the deposit heuristic is 0.186, so this is the measured norm.
