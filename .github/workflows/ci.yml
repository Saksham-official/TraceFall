name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracefall
          POSTGRES_PASSWORD: tracefall
          POSTGRES_DB: tracefall_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracefall"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration
      TEST_DATABASE_URL: postgresql+asyncpg://tracefall:tracefall@127.0.0.1:5432/tracefall_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" pip-audit
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q --cov --cov-report=term-missing:skip-covered
      # NFR-13: the three engines whose numbers reach a report are gated individually.
      # A whole-project average would let one of them rot behind the others.
      - name: Coverage gates on tracing, attribution and risk
        run: |
          pytest -q --cov=app/tracing --cov-fail-under=90 --cov-report= --no-header
          pytest -q --cov=app/attribution --cov-fail-under=80 --cov-report= --no-header
          pytest -q --cov=app/risk --cov-fail-under=80 --cov-report= --no-header
      # The regression lock. It runs in the main job, not only on merge: a number that
      # moves is worth knowing about on the pull request that moved it.
      - name: Golden case
        run: pytest -q tests/test_golden_case.py
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
