services:
  # Web service: TraceFall FastAPI application and worker
  - type: web
    name: tracefall-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LIVE_MODE
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: "none"
      - key: DATABASE_URL
        fromDatabase:
          name: tracefall-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tracefall-cache
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_ADMIN_NAME
        value: TraceFall Investigator

  - type: keyvalue
    name: tracefall-cache
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: tracefall-db
    databaseName: tracefall
    user: tracefall
    plan: free
    region: oregon
