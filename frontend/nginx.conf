server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        # Docker's embedded DNS, re-checked every 10 seconds. nginx resolves an upstream
        # named directly in proxy_pass exactly once, at startup, and caches the address
        # for the life of the process — so recreating the api container (any
        # `docker compose up -d api`) leaves every request 502 until nginx is restarted
        # too. Resolving through a variable defers the lookup to request time.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A trace runs for as long as provider rate limits make it run; the default 60s
        # would cut a live analysis off mid-request.
        proxy_read_timeout 180s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
